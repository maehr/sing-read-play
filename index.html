<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sing → Read → Play</title>
  </head>
  <body>
    <main class="app">
      <h1>Sing → Read → Play</h1>

      <section class="setup" aria-label="Setup">
        <ul class="status">
          <li>Microphone: <span id="mic-status" class="badge">checking…</span></li>
          <li>MIDI: <span id="midi-status" class="badge">checking…</span></li>
        </ul>
        <div class="controls">
          <label for="clef">Staff</label>
          <select id="clef">
            <option value="grand" selected>Grand staff</option>
            <option value="treble">Treble</option>
            <option value="bass">Bass</option>
            <option value="alto">Alto</option>
            <option value="tenor">Tenor</option>
          </select>
          <button id="start" type="button">Start</button>
        </div>
        <label class="option">
          <input id="always-names" type="checkbox" />
          Always show note names
        </label>
      </section>

      <section class="stage" aria-label="Practice">
        <p id="prompt" class="prompt" aria-live="polite">Press Start.</p>
        <div id="staff" class="staff"></div>
        <p id="note-name" class="note-name" aria-live="polite"></p>
        <p id="feedback" class="feedback" aria-live="assertive"></p>
        <p id="detector" class="detector" hidden></p>
      </section>

      <section class="stats" aria-label="Session stats">
        <p>Rounds: <span id="rounds">0</span></p>
        <p>First-try correct: <span id="first-try">0</span></p>
        <p>Accuracy: <span id="accuracy">0</span>%</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
